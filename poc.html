<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fullscreen Login PoC</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
    color: #202124;
  }

  body {
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .page {
    width: min(100%, 680px);
    min-height: 100dvh;
    padding: 48px 42px 36px;
    display: flex;
    flex-direction: column;
  }

  .top-screenshot {
    display: block;
    width: 100%;
    height: auto;
    margin: 0 0 28px;
    border-radius: 0;
  }

  .logo {
    display: inline-block;
    width: fit-content;
    height: auto;
    margin-bottom: 36px;
    font-size: 42px;
    line-height: 1;
    font-weight: 500;
    letter-spacing: -2px;
    font-family: Arial, Helvetica, sans-serif;
  }

  .logo .blue { color: #4285f4; }
  .logo .red { color: #ea4335; }
  .logo .yellow { color: #fbbc05; }
  .logo .green { color: #34a853; }

  h1 {
    font-size: 42px;
    font-weight: 400;
    margin: 0 0 10px;
  }

  .subtitle {
    font-size: 25px;
    margin-bottom: 48px;
  }

  .notice {
    font-size: 14px;
    color: #5f6368;
    margin: 24px 0;
    line-height: 1.45;
  }

  .field {
    position: relative;
    margin-bottom: 22px;
  }

  input {
    width: 100%;
    height: 64px;
    border: 2px solid #747474;
    border-radius: 7px;
    padding: 22px 16px 7px;
    font-size: 18px;
    outline: none;
    background: #fff;
  }

  input:focus {
    border-color: #1a73e8;
  }

  label {
    position: absolute;
    left: 13px;
    top: 20px;
    padding: 0 5px;
    color: #5f6368;
    background: #fff;
    pointer-events: none;
    transition: .12s ease;
    font-size: 16px;
  }

  input:focus + label,
  input:not(:placeholder-shown) + label {
    top: -9px;
    color: #1a73e8;
    font-size: 14px;
  }

  .button-row {
    margin-top: auto;
    padding-top: 35px;
    display: flex;
    justify-content: flex-end;
  }

  button {
    border: 0;
    border-radius: 24px;
    padding: 14px 30px;
    font-size: 17px;
    font-weight: 600;
    background: #1769e0;
    color: #fff;
    cursor: pointer;
  }

  button:active { transform: scale(.98); }

  .poc {
    margin-top: 16px;
    color: #777;
    font-size: 12px;
  }

  @media (max-width: 520px) {
    .page { padding: 38px 42px 30px; }
    h1 { font-size: 40px; }
    .subtitle { font-size: 23px; }
  }
</style>
</head>
<body>
  <main class="page">
    <img class="top-screenshot" src="./fake-address-bar.jpg" alt="Screenshot">
    <div class="logo" aria-label="Google"><span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span></div>

    <h1>Login</h1>
    <div class="subtitle">Continue to Demo</div>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <input id="email" name="email" type="text" placeholder=" " autocomplete="off">
        <label for="email">Email or phone</label>
      </div>

      <div class="field">
        <input id="password" name="password" type="password" placeholder=" " autocomplete="off">
        <label for="password">Password</label>
      </div>

      <div class="notice">
        Fullscreen PoC — credentials are not sent anywhere or stored.
        The button demonstrates exiting fullscreen from a user interaction.
      </div>

      <div class="button-row">
        <button type="submit">Login</button>
      </div>
    </form>

    <div class="poc">Fullscreen tossing / exit demonstration</div>
  </main>

<script>
  // Enter fullscreen after the page is loaded. Some mobile browsers may
  // require a user gesture, so failure here is intentionally ignored.
  async function enterFullscreen() {
    try {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        await document.documentElement.requestFullscreen();
      }
    } catch (e) {
      console.log("Fullscreen request was rejected:", e);
    }
  }

  // Try once on load for the PoC.
  window.addEventListener("load", enterFullscreen);

  document.getElementById("loginForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    // Demonstration only: do not collect, transmit, or persist credentials.
    try {
      if (document.fullscreenElement && document.exitFullscreen) {
        await document.exitFullscreen();
      }
    } catch (e) {
      console.log("Fullscreen exit failed:", e);
    }

    alert("Exit fullscreen");
  });
</script>
</body>
</html>
